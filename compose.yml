services:
    db:
        image: mariadb:10.6.27
        ports:
            - 3306:3306
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - mariadb_data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$DB_PASSWORD"]
            interval: 2s
            timeout: 5s
            retries: 5

    web:
        build: .
        working_dir: /php
        command: sh
        tty: true
        stdin_open: true
        volumes:
            - .:/php
        ports:
            - 8080:8080
        depends_on:
            db:
                condition: service_healthy

volumes:
    mariadb_data:
